        body {
            background-color: black;

        }
        .container {

        }
        #check-icon {
            margin-left: 1px;

            height: 100vh;
        }
        .others {
            display: flex;
            margin: -20px;
            margin-top: 5px;
            font-size: 24px;
            color: white;
            transition: color 0.3s ease;
            transition: transform 0.3s ease;
            gap: 5px;
        }
        .maintext {
            display: flex;
            align-items: center;
            gap: 1px;
        }
        .line {
            width: 150px;
            border: none;
            height: 2px;
            background: white;
            margin-top: -10px;
        }
        .fa-envelope {
            transition: color 0.3s ease;
            transition: transform 0.3s ease;
        }
        .fa-github {

            transition: transform 0.3s ease;

        .fa-discord {

        .fa-discord:hover {
            color: #007bff;
            transform: scale(1.2);
        }
        .fa-telegram {
            transition: color 0.3s ease;
            transition: transform 0.3s ease;
        }
        .fa-telegram:hover {
            color: #007bff;
            transform: scale(1.2);
        }
        a {
            color: white;
            text-decoration: none;
        }
        #toast {
            position: fixed;
            left: 50%;
            bottom: -60px;
            transform: translateX(-50%);
            background-color: #007bff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            z-index: 1000;
            transition: bottom 0.5s ease, opacity 0.5s ease;
        }

        #toast.show {
            bottom: 30px;
            opacity: 1;
        }
        
        nav {
            padding: 5px;
        }
        
        nav ul {
            margin-top: 5px;
            list-style-type: none;
            justify-content: space-around;
            display: flex;
        }

        nav ul li a {
            color: white;
            display: block;
            text-decoration: none;
            font-size: 24px;
            transition: color 0.3s ease;
            transition: transform 0.3s ease;
        }

        nav ul li a:hover {
            color: #007bff;
            transform: scale(1.2);
        }

        nav ul li a i {
            margin-right: 5px;
        }

        nav hr {
            border: none;
            height: 1px;
            background: white;
            margin-top: 10px;
        }

        a {
            cursor: pointer;
        }

        @media (max-width: 680px) {
            nav ul {
                display: block;
            }
            
            nav ul li a {
                margin-top: 10px;
            }
        }
    </style>
